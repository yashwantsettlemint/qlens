[project]
name = "invoice-tracker-shared-types"
version = "0.1.0"
description = "Enums and constants shared across the Python services"
requires-python = ">=3.11"
dependencies = ["pyjwt>=2.9", "fastapi>=0.100"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shared_types"]

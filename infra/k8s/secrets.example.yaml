# Copy to secrets.yaml, fill in real values, `kubectl apply -f infra/k8s/secrets.yaml`.
# Never commit the filled-in version — infra/k8s/secrets.yaml is gitignored.
#
# Generate strong values with, e.g.: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: invoice-tracker-secrets
  namespace: invoice-tracker
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "invoice_tracker"
  PG_DATABASE_URL: "postgres://postgres:CHANGE_ME@postgres:5432/invoice_tracker"
  HASURA_GRAPHQL_DATABASE_URL: "postgres://postgres:CHANGE_ME@postgres:5432/invoice_tracker"
  PG_OCR_DATABASE_URL: "postgres://postgres:CHANGE_ME@postgres:5432/ocr_db"
  AUTH_PG_DATABASE_URL: "postgres://auth_service:CHANGE_ME@postgres:5432/invoice_tracker"

  # Hasura — do NOT reuse the compose defaults (devsecret / dev-jwt-signing-key...)
  HASURA_GRAPHQL_ADMIN_SECRET: "CHANGE_ME"
  HASURA_ADMIN_SECRET: "CHANGE_ME" # same value as above; the Python services read this name
  HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"CHANGE_ME_32_CHARS_MIN"}'

  RABBITMQ_DEFAULT_USER: "CHANGE_ME"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME"
  RABBITMQ_URL: "amqp://CHANGE_ME:CHANGE_ME@rabbitmq:5672/"

  # Shared secret every internal call (web BFF, Hasura event/cron/action
  # webhooks) must send as X-Internal-Token — see shared_types/auth.py.
  INTERNAL_SERVICE_TOKEN: "CHANGE_ME"

  # LLM (genai-service, ocr-service) — leave blank to keep the offline regex fallback
  LLM_BASE_URL: ""
  LLM_API_KEY: ""
  LLM_MODEL: ""
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_KEY: ""
  AZURE_OPENAI_DEPLOYMENT: ""

  # notification-service channel (NOTIFY_CHANNEL=slack|email in the ConfigMap)
  SLACK_WEBHOOK_URL: ""
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  EMAIL_FROM: ""
  EMAIL_TO: ""

  # web BFF (HASURA_ADMIN_SECRET and HASURA_GRAPHQL_JWT_SECRET above are reused as-is)
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""

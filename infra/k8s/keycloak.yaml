# Real OIDC IdP. Single replica + start-dev here mirrors the rest of this
# k8s/ directory (every service is single-replica, no HA yet — see
# PRODUCTION_READINESS.md); swap `start-dev` for `start` with a real Postgres
# datasource before this sees real traffic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  namespace: invoice-tracker
data:
  realm-export.json: |
    # populated from infra/keycloak/realm-export.json — e.g.:
    #   kubectl create configmap keycloak-realm-import \
    #     --from-file=realm-export.json=infra/keycloak/realm-export.json \
    #     -n invoice-tracker --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: invoice-tracker
spec:
  replicas: 1
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata: { labels: { app: keycloak } }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: invoice-tracker-config }
            - secretRef: { name: invoice-tracker-secrets }
          env:
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HOSTNAME, value: "https://your-domain.example/auth" }
            - { name: KC_HTTP_RELATIVE_PATH, value: "/auth" }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, valueFrom: { secretKeyRef: { name: invoice-tracker-secrets, key: KEYCLOAK_ADMIN } } }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: invoice-tracker-secrets, key: KEYCLOAK_ADMIN_PASSWORD } } }
          volumeMounts:
            - { name: realm-import, mountPath: /opt/keycloak/data/import }
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 300m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: realm-import
          configMap: { name: keycloak-realm-import }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: invoice-tracker
spec:
  selector: { app: keycloak }
  ports: [{ port: 8080, targetPort: 8080 }]

# App services: ingestion, ml, genai, notification, auth, ocr (all internal —
# no Ingress) and web (the only one with public Ingress, see ingress.yaml).
#
# Image refs use ${REGISTRY}/<name>:${TAG} placeholders — substitute before
# applying, e.g.:
#   REGISTRY=ghcr.io/you TAG=$(git rev-parse --short HEAD) \
#     envsubst < infra/k8s/services.yaml | kubectl apply -f -

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: invoice-tracker
spec:
  replicas: 1
  selector: { matchLabels: { app: ingestion-service } }
  template:
    metadata: { labels: { app: ingestion-service } }
    spec:
      containers:
        - name: ingestion-service
          image: ${REGISTRY}/ingestion-service:${TAG}
          ports: [{ containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: invoice-tracker-config }
            - secretRef: { name: invoice-tracker-secrets }
          readinessProbe: { httpGet: { path: /health, port: 8001 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8001 }, periodSeconds: 30 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: ingestion-service, namespace: invoice-tracker }
spec:
  selector: { app: ingestion-service }
  ports: [{ port: 8001, targetPort: 8001 }]


name: invoice-tracker

# Foundation stack: Postgres + Hasura (migrations & metadata auto-applied) + a
# one-shot seed loader + the FastAPI services.
#
# All services read infra/.env via env_file.

services:
  postgres:
    image: pgvector/pgvector:pg16   # postgres:16 + the `vector` extension (RAG); data dir is compatible
    restart: unless-stopped
    env_file: [.env]
    ports:
      # host 5433 to avoid clashing with a local Postgres; containers use 5432 over the compose network
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:  # queue for ocr-service's bulk document upload (POST /bulk/enqueue)
             # and notification-service's outbound email delivery (notify.outbound)
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      # host 5673/15673 — an unrelated RabbitMQ elsewhere on this machine can
      # squat the 5672/15672 defaults; containers still talk over 5672 on the
      # internal compose network regardless of this host-side mapping.
      - "5673:5672"    # amqp
      - "15673:15672"  # management UI, http://localhost:15673 (guest/guest)
    healthcheck:
      # -diagnostics spins up a fresh Erlang node each call, which can take
      # a few seconds on its own — a 5s timeout was failing that alone.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 15s
      retries: 24

  hasura:
    image: hasura/graphql-engine:v2.42.0.cli-migrations-v3
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../hasura/migrations:/hasura-migrations
      - ../hasura/metadata:/hasura-metadata
    environment:
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log,query-log
    healthcheck:
      # graphql-engine images ship curl; if a future tag drops it, probe externally instead.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24

  seed:
    image: pgvector/pgvector:pg16
    restart: "no"
    env_file: [.env]
    depends_on:
      hasura:
        condition: service_healthy
    volumes:
      - ../hasura/seeds/default:/seeds:ro
    command: ["sh", "-c", "psql \"$$PG_DATABASE_URL\" -v ON_ERROR_STOP=1 -f /seeds/1730000000001_seed.sql"]

  ingestion-service:
    build:
      context: ..
      dockerfile: services/ingestion-service/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      HASURA_ENDPOINT: http://hasura:8080/v1/graphql
    ports:
      # host 8091 to dodge a local service on 8001; container listens on 8001
      - "8091:8001"
    depends_on:
      hasura:
        condition: service_healthy
    healthcheck: &pyhealth
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8001/health').status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 6

  ml-service:  # target of the invoices event trigger (/score) + checkDuplicateSync action (/check-duplicate)
    build:
      context: ..
      dockerfile: services/ml-service/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      HASURA_ENDPOINT: http://hasura:8080/v1/graphql
    ports:
      - "8092:8002"
    volumes:
      # host-trained models win over the ones baked into the image; retrain then
      # `docker compose restart ml-service` — no rebuild. Delete to use image models.
      - ../services/ml-service/models:/svc/service/models
    depends_on:
      hasura:
        condition: service_healthy
    healthcheck:
      <<: *pyhealth
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]

  genai-service:  # reads Hasura as genai_readonly; /embed as genai_writer (both self-minted JWTs)
    build:
      context: ..
      dockerfile: services/genai-service/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      HASURA_ENDPOINT: http://hasura:8080/v1/graphql
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      # the model is baked into the image at build time (see Dockerfile) — skip
      # the HF Hub freshness check so a network hiccup can't stall/retry every
      # embed call for ~30s (5 retries w/ backoff) chasing a check we don't need.
      HF_HUB_OFFLINE: "1"
    ports:
      - "8093:8003"
    depends_on:
      hasura:
        condition: service_healthy
    healthcheck:
      <<: *pyhealth
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]

  notification-service:  # target of the overdue_sweep_daily cron trigger (/overdue-sweep)
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      HASURA_ENDPOINT: http://hasura:8080/v1/graphql
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8094:8004"
    depends_on:
      hasura:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *pyhealth
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]

  keycloak:  # real OIDC IdP — credentials + brute-force lockout live here now
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    env_file: [.env]
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Both var names set — Keycloak's admin-bootstrap env var was renamed
      # across major versions (KEYCLOAK_ADMIN* -> KC_BOOTSTRAP_ADMIN_*).
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Fixed hostname (the full URL form, not just a bare hostname — Keycloak's
      # v2 hostname provider otherwise keeps whatever port/scheme the request
      # actually arrived on) so every token Keycloak issues carries the same
      # `iss` regardless of whether the request came from the browser
      # (localhost:8097, via the host port mapping below) or from another
      # container (http://keycloak:8080, the compose network's own DNS) —
      # see auth.ts's PUBLIC_ISSUER/INTERNAL_ISSUER split.
      KC_HOSTNAME: http://localhost:8097
    command: ["start-dev", "--import-realm"]
    ports:
      - "8097:8080"
    volumes:
      - ../infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # KC_HEALTH_ENABLED exposes /health on the management port (9000), not
      # the main HTTP port (8080) — probing 8080 here always fails even when
      # Keycloak itself is up and serving the realm fine.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 24

  auth-service:  # company/role bookkeeping -> Hasura-shaped HS256 JWTs; register/invite live here.
                 # Credentials + brute-force lockout are Keycloak's job (see infra/keycloak).
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "8095:8005"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *pyhealth
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\""]

  ocr-service:  # CPU OCR + field extraction; writes invalid drafts to review_queue (as ocr_service)
    build:
      context: ..
      dockerfile: services/ocr-service/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      HASURA_ENDPOINT: http://hasura:8080/v1/graphql
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      # host 8096; container 8006 (the 6th service, past the brief's 8001-8005)
      - "8096:8006"
    depends_on:
      hasura:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *pyhealth
      # first request can be slow (PP-StructureV3 model load); generous start
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8006/health')\""]
      retries: 12

  web:  # Next.js BFF — the actual frontend; talks to Hasura + genai/ml/notification/ocr server-side
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* vars are inlined at build time (see Dockerfile) — a
        # runtime `environment:` override below would have no effect on this one.
        NEXT_PUBLIC_AUTH_URL: http://auth-service:8005
    restart: unless-stopped
    env_file: [.env]
    environment:
      # env_file's HASURA_ENDPOINT is the host-facing localhost default (used
      # by local tooling outside docker) — every service overrides it the
      # same way for container-to-container calls.
      HASURA_ENDPOINT: http://hasura:8080/v1/graphql
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # Browser-facing vs container-to-container Keycloak URL — see auth.ts.
      AUTH_KEYCLOAK_ISSUER: http://localhost:8097/realms/invoice-tracker
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/invoice-tracker
      # NextAuth's own AUTH_TRUST_HOST header-based detection reports this
      # standalone server's bind address (0.0.0.0:3000) instead of the
      # actual host-mapped port behind docker-compose — set explicitly
      # instead of relying on auto-detection.
      AUTH_URL: http://localhost:3002
    ports:
      # host 3002 — 3000/3001 are commonly taken by a local `next dev` or another
      # tool; container still listens on 3000.
      - "3002:3000"
    depends_on:
      hasura:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:

name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run codegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # --omit=dev: dev/build-time tooling (graphql-codegen's lodash, vitest's
      # esbuild dev server) currently carries advisory-range transitive deps
      # with no non-breaking fix — never shipped to the running app, so they'd
      # otherwise fail this gate for reasons unrelated to what actually ships.
      - run: npm audit --omit=dev --audit-level=high

  services:
    runs-on: ubuntu-latest
    # test_auth.py needs a real Postgres with the schema applied — it exercises
    # auth-service's DB-backed login/lockout/invite flow against actual rows
    # (e.g. the multi_tenant migration's seeded "kavya" user), not mocks.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: invoice_tracker
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5433/invoice_tracker
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"dev-jwt-signing-key-change-me-32chars-min"}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply hasura/migrations/default in order
        env:
          PGPASSWORD: postgrespassword
        run: |
          for f in hasura/migrations/default/*/up.sql; do
            echo "applying $f"
            psql -h localhost -p 5433 -U postgres -d invoice_tracker -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Install shared-types + every service
        run: |
          pip install -e packages/shared-types
          for d in services/*/; do pip install -e "$d"; done
      - name: pip-audit (fail on known vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit --strict
      - name: Run each service's check script
        run: |
          for t in services/*/tests/test_*.py; do
            svc="$(cd "$(dirname "$t")/.." && pwd)"
            echo "== $t =="
            (cd "$svc" && PYTHONPATH="$svc" python "tests/$(basename "$t")") || exit 1
          done

  # ponytail: build-only, catches a broken Dockerfile — wire up registry push
  # + `kubectl apply` once a registry/cluster target is chosen (see infra/k8s/).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every service image
        run: |
          for d in services/*/; do
            name="$(basename "$d")"
            docker build -f "$d/Dockerfile" -t "$name:ci" .
          done
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t web:ci .

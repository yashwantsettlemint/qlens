[project]
name = "auth-service"
version = "0.1.0"
description = "Company/role bookkeeping + Hasura-shaped JWT issuing; credentials are owned by Keycloak"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "invoice-tracker-shared-types",
  "psycopg[binary]>=3.1",
  "pydantic>=2",
  "httpx>=0.27",
  "slowapi>=0.1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

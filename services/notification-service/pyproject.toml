[project]
name = "notification-service"
version = "0.1.0"
description = "Daily overdue sweep — marks past-due invoices overdue and sends a digest"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "invoice-tracker-shared-types",
  "pydantic>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

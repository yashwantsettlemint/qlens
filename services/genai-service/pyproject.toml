[project]
name = "genai-service"
version = "0.1.0"
description = "LLM summaries / explanations over the invoice data, scoped to genai_readonly"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "openai>=1.40",
  "pypdf>=5.1",
  "sentence-transformers>=3.0",
  "invoice-tracker-shared-types",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "ingestion-service"
version = "0.1.0"
description = "CSV / manual invoice ingestion — validate, then commit through Hasura as finance_user"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "invoice-tracker-shared-types",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

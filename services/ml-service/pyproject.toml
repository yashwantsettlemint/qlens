[project]
name = "ml-service"
version = "0.1.0"
description = "Duplicate detection (rule-based) + delay prediction (XGBoost) for invoices"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "xgboost>=2.1",
  "shap>=0.46",
  "invoice-tracker-shared-types",
  "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "ml"]

table:
  name: duplicate_flags
  schema: public
object_relationships:
  - name: invoice
    using:
      foreign_key_constraint_on: invoice_id
  - name: matchedInvoice
    using:
      manual_configuration:
        remote_table:
          name: invoices
          schema: public
        column_mapping:
          matched_invoice_id: id
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: {}
  - role: approver
    permission:
      columns: "*"
      filter: {}
  - role: genai_readonly
    permission:
      columns: "*"
      filter: {}

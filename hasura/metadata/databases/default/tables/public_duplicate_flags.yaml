table:
  name: duplicate_flags
  schema: public
object_relationships:
  - name: invoice
    using:
      foreign_key_constraint_on: invoice_id
  - name: matchedInvoice
    using:
      manual_configuration:
        remote_table:
          name: invoices
          schema: public
        column_mapping:
          matched_invoice_id: id
insert_permissions:
  - role: ml_service
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - invoice_id
        - matched_invoice_id
        - confidence_score
        - method
        - reviewed_status
        - reason
        - explanation
delete_permissions:
  - role: ml_service
    permission:
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: approver
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: company_admin
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: genai_readonly
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: ml_service
    # Not read directly — needed so Hasura exposes invoice_id/reviewed_status
    # in this role's generated bool_exp, which the delete-then-insert
    # rescoring mutation's `where` clause relies on.
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }

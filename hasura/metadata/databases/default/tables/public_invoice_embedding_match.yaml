table:
  name: invoice_embedding_match
  schema: public
# Return type of match_invoice_embeddings(). Tracked only so the function is
# exposable; genai_readonly needs select here for the function permission to apply.
select_permissions:
  - role: genai_readonly
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }

table:
  name: payments
  schema: public
object_relationships:
  - name: invoice
    using:
      foreign_key_constraint_on: invoice_id
insert_permissions:
  - role: finance_user
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - invoice_id
        - paid_at
        - amount_paid
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: approver
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: company_admin
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
update_permissions:
  - role: finance_user
    permission:
      columns:
        - paid_at
        - amount_paid
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}

table:
  name: payments
  schema: public
object_relationships:
  - name: invoice
    using:
      foreign_key_constraint_on: invoice_id
insert_permissions:
  - role: finance_user
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - invoice_id
        - paid_at
        - amount_paid
  - role: company_admin
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - invoice_id
        - paid_at
        - amount_paid
  - role: payments_webhook
    permission:
      check: {}
      columns:
        - invoice_id
        - paid_at
        - amount_paid
        - company_id
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: approver
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: company_admin
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: ml_service
    # Needed only for the nested `payments` relationship under `invoices` in
    # ml-service's context query (paid-on-time history).
    permission:
      columns:
        - invoice_id
        - paid_at
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: payments_webhook
    permission:
      columns:
        - id
      filter: {}
update_permissions:
  - role: finance_user
    permission:
      columns:
        - paid_at
        - amount_paid
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}

table:
  name: invoice_line_items
  schema: public
object_relationships:
  - name: invoice
    using:
      foreign_key_constraint_on: invoice_id
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: approver
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: company_admin
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: genai_readonly
    # invoiceSummary's lineItems relationship (services/genai-service's
    # _INVOICE_SUMMARY_CTX query) needs this to traverse invoices.lineItems.
    permission:
      columns:
        - description
        - quantity
        - unit_price
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: genai_writer
    # Needed for the `lineItems` relationship under invoices in
    # _INVOICE_FULL — cross-tenant, same as genai_writer's invoices grant.
    permission:
      columns:
        - description
        - quantity
        - unit_price
      filter: {}

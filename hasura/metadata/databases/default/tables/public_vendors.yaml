table:
  name: vendors
  schema: public
array_relationships:
  - name: invoices
    using:
      foreign_key_constraint_on:
        column: vendor_id
        table:
          name: invoices
          schema: public
  - name: purchaseOrders
    using:
      foreign_key_constraint_on:
        column: vendor_id
        table:
          name: purchase_orders
          schema: public
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: {}
  - role: approver
    permission:
      columns: "*"
      filter: {}
  - role: genai_readonly
    permission:
      columns: "*"
      filter: {}

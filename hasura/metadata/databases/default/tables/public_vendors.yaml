table:
  name: vendors
  schema: public
array_relationships:
  - name: invoices
    using:
      foreign_key_constraint_on:
        column: vendor_id
        table:
          name: invoices
          schema: public
  - name: purchaseOrders
    using:
      foreign_key_constraint_on:
        column: vendor_id
        table:
          name: purchase_orders
          schema: public
insert_permissions:
  - role: finance_user
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - name
        - tax_id
        - payment_terms_days
        - email
  - role: company_admin
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - name
        - tax_id
        - payment_terms_days
        - email
update_permissions:
  - role: finance_user
    permission:
      columns:
        - email
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}
  - role: company_admin
    permission:
      columns:
        - email
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: approver
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: company_admin
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: genai_readonly
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: ocr_service
    permission:
      columns:
        - id
        - name
        - company_id
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: notifier
    # Cross-tenant, same as its `invoices` permission — see public_invoices.yaml.
    permission:
      columns:
        - id
        - name
        - email
      filter: {}
  - role: genai_writer
    # Needed for the `vendor { name }` relationship under invoices in
    # _INVOICE_FULL — cross-tenant, same as genai_writer's invoices grant.
    permission:
      columns:
        - name
      filter: {}
  - role: ml_service
    # No vendor columns are actually read — just needed to expose the
    # `vendor { invoices {...} }` relationship traversal in ml/train.py's
    # payment-history query.
    permission:
      columns:
        - id
      filter: { company_id: { _eq: X-Hasura-Company-Id } }

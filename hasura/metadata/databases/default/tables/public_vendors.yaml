table:
  name: vendors
  schema: public
array_relationships:
  - name: invoices
    using:
      foreign_key_constraint_on:
        column: vendor_id
        table:
          name: invoices
          schema: public
  - name: purchaseOrders
    using:
      foreign_key_constraint_on:
        column: vendor_id
        table:
          name: purchase_orders
          schema: public
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: approver
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: company_admin
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: genai_readonly
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }

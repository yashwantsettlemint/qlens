table:
  name: delay_predictions
  schema: public
object_relationships:
  - name: invoice
    using:
      foreign_key_constraint_on: invoice_id
insert_permissions:
  - role: ml_service
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - invoice_id
        - delay_probability
        - predicted_delay_days
        - model_version
        - explanation
delete_permissions:
  - role: ml_service
    permission:
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: approver
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: company_admin
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: genai_readonly
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: ml_service
    # Not read directly — needed so Hasura exposes invoice_id in this role's
    # generated bool_exp, which the delete-then-insert mutation's `where`
    # clause relies on.
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }

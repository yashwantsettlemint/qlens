table:
  name: invoice_embeddings
  schema: public
object_relationships:
  - name: invoice
    using:
      foreign_key_constraint_on: invoice_id
# Written by genai-service /embed as `genai_writer` (mints its own JWT, see
# services/genai-service/app/hasura.py); read only through
# match_invoice_embeddings() as genai_readonly. No `company_id` column on
# this table itself, so the filter goes through the `invoice` relationship.
insert_permissions:
  - role: genai_writer
    permission:
      check: { invoice: { company_id: { _eq: X-Hasura-Company-Id } } }
      columns:
        - invoice_id
        - chunk_text
        - embedding
select_permissions:
  - role: genai_writer
    # Not read directly by genai-service (reads go through
    # match_invoice_embeddings as genai_readonly) — needed so Hasura exposes
    # `invoice_id` in this role's generated bool_exp, which the delete
    # mutation's `where: {invoice_id: {_eq: ...}}` filter relies on.
    permission:
      columns:
        - id
        - invoice_id
        - chunk_text
        - created_at
      filter: { invoice: { company_id: { _eq: X-Hasura-Company-Id } } }
delete_permissions:
  - role: genai_writer
    permission:
      filter: { invoice: { company_id: { _eq: X-Hasura-Company-Id } } }

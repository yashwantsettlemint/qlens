table:
  name: invoices
  schema: public
object_relationships:
  - name: vendor
    using:
      foreign_key_constraint_on: vendor_id
  - name: customer
    using:
      foreign_key_constraint_on: customer_id
  - name: purchaseOrder
    using:
      foreign_key_constraint_on: po_id
  - name: duplicateFlag
    using:
      manual_configuration:
        remote_table:
          name: duplicate_flags
          schema: public
        column_mapping:
          id: invoice_id
  - name: delayPrediction
    using:
      manual_configuration:
        remote_table:
          name: delay_predictions
          schema: public
        column_mapping:
          id: invoice_id
array_relationships:
  - name: approvals
    using:
      foreign_key_constraint_on:
        column: invoice_id
        table:
          name: approvals
          schema: public
  - name: payments
    using:
      foreign_key_constraint_on:
        column: invoice_id
        table:
          name: payments
          schema: public
  - name: lineItems
    using:
      foreign_key_constraint_on:
        column: invoice_id
        table:
          name: invoice_line_items
          schema: public
insert_permissions:
  - role: finance_user
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - invoice_number
        - description
        - extracted_text
        - direction
        - vendor_id
        - customer_id
        - po_id
        - invoice_date
        - due_date
        - amount
        - tax_amount
        - department
        - approval_status
        - collection_status
        - payment_status
        - source
        - created_by
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: approver
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: company_admin
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: genai_readonly
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
update_permissions:
  - role: finance_user
    permission:
      columns:
        - invoice_number
        - description
        - vendor_id
        - customer_id
        - po_id
        - invoice_date
        - due_date
        - amount
        - tax_amount
        - department
        - approval_status
        - collection_status
        - payment_status
        - source
        - created_by
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}
event_triggers:
  - name: invoice_ml_score
    definition:
      enable_manual: true
      insert:
        columns: "*"
      update:
        columns:
          # delay-model features
          - amount
          - tax_amount
          - vendor_id
          - customer_id
          - direction
          - department
          - invoice_date
          - po_id
          # a payment-status change shifts the party's on-time rate -> ml-service
          # re-scores that party's other open invoices
          - payment_status
    retry_conf:
      num_retries: 3
      interval_sec: 15
      timeout_sec: 60
    webhook_from_env: ML_SERVICE_SCORE_URL
    headers:
      - name: x-service-source
        value: hasura-event-trigger
  - name: invoice_embed
    definition:
      enable_manual: true
      insert:
        columns: "*"
      update:
        columns:
          - invoice_number
          - vendor_id
          - amount
          - tax_amount
          - department
          - invoice_date
          - due_date
          - approval_status
          - payment_status
    retry_conf:
      num_retries: 3
      interval_sec: 30
      timeout_sec: 60
    webhook: "{{GENAI_SERVICE_URL}}/embed"
    headers:
      - name: x-service-source
        value: hasura-event-trigger

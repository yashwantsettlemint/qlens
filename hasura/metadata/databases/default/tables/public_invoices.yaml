table:
  name: invoices
  schema: public
object_relationships:
  - name: vendor
    using:
      foreign_key_constraint_on: vendor_id
  - name: purchaseOrder
    using:
      foreign_key_constraint_on: po_id
  - name: duplicateFlag
    using:
      manual_configuration:
        remote_table:
          name: duplicate_flags
          schema: public
        column_mapping:
          id: invoice_id
  - name: delayPrediction
    using:
      manual_configuration:
        remote_table:
          name: delay_predictions
          schema: public
        column_mapping:
          id: invoice_id
array_relationships:
  - name: approvals
    using:
      foreign_key_constraint_on:
        column: invoice_id
        table:
          name: approvals
          schema: public
  - name: payments
    using:
      foreign_key_constraint_on:
        column: invoice_id
        table:
          name: payments
          schema: public
  - name: lineItems
    using:
      foreign_key_constraint_on:
        column: invoice_id
        table:
          name: invoice_line_items
          schema: public
insert_permissions:
  - role: finance_user
    permission:
      check: {}
      columns:
        - invoice_number
        - vendor_id
        - po_id
        - invoice_date
        - due_date
        - amount
        - tax_amount
        - department
        - approval_status
        - payment_status
        - source
        - created_by
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: {}
  - role: approver
    permission:
      columns: "*"
      filter: {}
  - role: genai_readonly
    permission:
      columns: "*"
      filter: {}
update_permissions:
  - role: finance_user
    permission:
      columns:
        - invoice_number
        - vendor_id
        - po_id
        - invoice_date
        - due_date
        - amount
        - tax_amount
        - department
        - approval_status
        - payment_status
        - source
        - created_by
      filter: {}
      check: {}
event_triggers:
  - name: invoice_ml_score
    definition:
      enable_manual: true
      insert:
        columns: "*"
      update:
        columns:
          - amount
          - vendor_id
          - department
    retry_conf:
      num_retries: 3
      interval_sec: 15
      timeout_sec: 60
    webhook_from_env: ML_SERVICE_SCORE_URL
    headers:
      - name: x-service-source
        value: hasura-event-trigger

table:
  name: approvals
  schema: public
object_relationships:
  - name: invoice
    using:
      foreign_key_constraint_on: invoice_id
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: approver
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: company_admin
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
update_permissions:
  - role: approver
    permission:
      # approvers may only act on their own approval rows, and only these fields
      columns:
        - status
        - acted_at
      filter:
        approver:
          _eq: X-Hasura-User-Id
      check:
        approver:
          _eq: X-Hasura-User-Id

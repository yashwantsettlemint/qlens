table:
  name: approvals
  schema: public
object_relationships:
  - name: invoice
    using:
      foreign_key_constraint_on: invoice_id
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: approver
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: company_admin
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: ml_service
    # Only used via `approvals_aggregate { aggregate { count } }` under
    # invoices, for ml-service's drift-sampling query — no direct row read.
    permission:
      columns:
        - id
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
update_permissions:
  - role: approver
    permission:
      # approvers may only act on their own approval rows, and only these fields
      columns:
        - status
        - acted_at
      filter:
        approver:
          _eq: X-Hasura-User-Id
      check:
        approver:
          _eq: X-Hasura-User-Id

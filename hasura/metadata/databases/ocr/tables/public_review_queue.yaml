table:
  name: review_queue
  schema: public
insert_permissions:
  - role: ocr_service
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - invoice_draft
        - issues
select_permissions:
  - role: ocr_service
    # Not read directly — a select grant is what makes Hasura expose the
    # `insert_review_queue_one(...) { id }` mutation at all (same rule as
    # invoice_embeddings' genai_writer grant).
    permission:
      columns:
        - id
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: finance_user
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: company_admin
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
update_permissions:
  - role: finance_user
    permission:
      # a reviewer resolves a draft: pending -> committed | rejected
      columns:
        - status
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}
  - role: company_admin
    permission:
      columns:
        - status
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}
